<!DOCTYPE html>
<html>
<head>
    <title>Debug Fotocamera</title>
</head>
<body>
    <h1>Test Fotocamera AR.js</h1>
    <p id="status">Verificando...</p>

    <script src="https://aframe.io/releases/1.4.2/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/ar.js@3.4.5/aframe/aframe-ar-nft.js"></script>

    <script>
        // Controlla supporto fotocamera
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(() => {
                document.getElementById('status').innerHTML = '✓ Fotocamera disponibile!';
                console.log('✓ Fotocamera OK');
            })
            .catch(err => {
                console.error('Errore fotocamera:', err.name, err.message);
                document.getElementById('status').innerHTML = `
                    <span style="color: red;">✗ Errore: ${err.name}</span><br>
                    ${err.message}
                `;
            });
    </script>
</body>
</html>
