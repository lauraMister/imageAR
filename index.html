<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>AR Planet Project - Root Version</title>
    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      .arjs-loader {
        height: 100%; width: 100%; position: absolute; top: 0; left: 0;
        background-color: rgba(0, 0, 0, 0.8); z-index: 9999;
        display: flex; justify-content: center; align-items: center; color: white;
        font-family: sans-serif;
      }
    </style>
  </head>

  <body style="margin: 0px; overflow: hidden;">
    <div class="arjs-loader"><div>Caricamento tracciamento planetario...</div></div>

    <a-scene
      vr-mode-ui="enabled: false;"
      renderer="logarithmicDepthBuffer: true; precision: medium;"
      embedded
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <video 
          id="planet-video" 
          src="planet.mp4" 
          preload="auto" 
          loop="true" 
          crossorigin="anonymous" 
          playsinline 
          webkit-playsinline>
        </video>
      </a-assets>

      <a-nft
        type="nft"
        url="./planet"
        smooth="true"
        smoothCount="10"
        smoothTolerance=".01"
        smoothThreshold="5"
      >
        <a-video
          src="#planet-video"
          width="160"
          height="90"
          position="0 0 0"
          rotation="-90 0 0"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      // Gestione interazione utente per avviare l'audio/video
      // I browser moderni richiedono un click per riprodurre media
      window.addEventListener('click', function () {
        const video = document.querySelector('#planet-video');
        if (video.paused) {
          video.play();
        }
      });
    </script>
  </body>
</html>
