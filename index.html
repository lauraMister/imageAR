<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AR Planet Project - AR.js Version</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; font-family: sans-serif; overflow: hidden; width: 100vw; height: 100vh; }

    .arjs-loader {
      position: fixed; inset: 0; background: rgba(0,0,0,0.85); z-index: 9999;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      gap: 16px; color: white;
    }
    .arjs-loader .spinner {
      width: 48px; height: 48px; border: 4px solid rgba(255,255,255,0.2);
      border-top-color: #fff; border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .arjs-loader p { font-size: 15px; letter-spacing: 0.05em; opacity: 0.85; }

    #badge {
      position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: white; font-size: 12px; letter-spacing: 0.08em;
      padding: 6px 16px; border-radius: 999px; border: 1px solid rgba(255,255,255,0.15);
      pointer-events: none;
    }
    #badge span { color: #7dd3fc; font-weight: 700; }

    #hint {
      position: fixed; bottom: 24px; left: 50%; transform: translateX(-50%);
      z-index: 100; background: rgba(0,0,0,0.55); backdrop-filter: blur(8px);
      color: rgba(255,255,255,0.75); font-size: 13px; padding: 8px 20px;
      border-radius: 999px; border: 1px solid rgba(255,255,255,0.1);
      white-space: nowrap; pointer-events: none; transition: opacity 0.5s;
    }
  </style>
</head>
<body>
  <div class="arjs-loader">
    <div class="spinner"></div>
    <p>Caricamento tracciamento planetario...</p>
  </div>

  <div id="badge">Libreria: <span>AR.js + A-Frame</span></div>
  <div id="hint">📷 Punta la fotocamera sul marker del pianeta</div>

  <!-- A-Frame + AR.js NFT (image tracking) -->
  <script src="https://cdn.jsdelivr.net/gh/aframevr/aframe@1c2407b26c61958baa93967b5412487cd94b290b/dist/aframe-master.min.js"></script>
  <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

  <a-scene
    vr-mode-ui="enabled: false;"
    renderer="logarithmicDepthBuffer: true; antialias: true;"
    embedded
    arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
  >
    <!-- Asset: video del pianeta -->
    <a-assets>
      <video
        id="planet-video"
        src="planet.mp4"
        preload="auto"
        loop
        muted
        playsinline
        webkit-playsinline
        crossorigin="anonymous"
      ></video>
    </a-assets>

    <!--
      NFT anchor: punta al prefisso 'planet' (senza estensione).
      I file planet.fset, planet.fset3, planet.iset devono essere
      nella stessa cartella di index.html.

      Regola width/height in base alle proporzioni di planet.mp4:
        - 16:9  → width="1" height="0.5625"
        - 1:1   → width="1" height="1"
        - 9:16  → width="1" height="1.778"
    -->
    <a-nft
      type="nft"
      url="./planet"
      smooth="true"
      smoothCount="10"
      smoothTolerance="0.01"
      smoothThreshold="5"
      emitevents="true"
      id="nft-anchor"
    >
      <a-video
        src="#planet-video"
        width="1"
        height="0.5625"
        position="0 0 0.01"
        rotation="0 0 0"
      ></a-video>
    </a-nft>

    <!-- Camera gestita da AR.js -->
    <a-entity camera></a-entity>
  </a-scene>

  <script>
    // Nascondi loader quando i marker NFT sono pronti
    window.addEventListener("arjs-nft-loaded", () => {
      document.querySelector(".arjs-loader").style.display = "none";
      console.log("✅ AR.js NFT marker caricato");
    });

    // Fallback: nascondi loader dopo 8 secondi se l'evento non scatta
    setTimeout(() => {
      const loader = document.querySelector(".arjs-loader");
      if (loader) loader.style.display = "none";
    }, 8000);

    // Attiva video al primo click/tap (richiesto dai browser mobili)
    document.addEventListener("click", () => {
      document.getElementById("planet-video").play().catch(() => {});
    }, { once: true });

    // Gestisci eventi found/lost sul marker
    const nftAnchor = document.getElementById("nft-anchor");

    nftAnchor.addEventListener("markerFound", () => {
      console.log("🎯 Marker rilevato!");
      document.getElementById("planet-video").play().catch(() => {});
      document.getElementById("hint").style.opacity = "0";
    });

    nftAnchor.addEventListener("markerLost", () => {
      console.log("❌ Marker perso");
      document.getElementById("planet-video").pause();
      document.getElementById("hint").style.opacity = "1";
    });
  </script>
</body>
</html>
