<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>AR Planet</title>

    <script src="https://aframe.io/releases/1.4.1/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      .arjs-loader {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
      }

      .arjs-loader div {
        text-align: center;
        padding: 16px 20px;
        font-size: 18px;
        line-height: 1.4;
      }

      .ui-message {
        position: absolute;
        left: 50%;
        bottom: 20px;
        transform: translateX(-50%);
        z-index: 15;
        padding: 10px 14px;
        border-radius: 999px;
        background: rgba(0, 0, 0, 0.65);
        color: #fff;
        font-size: 14px;
        line-height: 1.3;
        pointer-events: none;
      }

      .tap-to-start {
        position: absolute;
        inset: 0;
        z-index: 25;
        display: none;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.45);
        color: #fff;
        text-align: center;
        padding: 24px;
      }

      .tap-to-start button {
        border: 0;
        border-radius: 999px;
        padding: 14px 20px;
        font-size: 16px;
        cursor: pointer;
        background: #fff;
        color: #111;
      }

      .is-hidden {
        display: none !important;
      }
    </style>
  </head>

  <body>
    <div class="arjs-loader">
      <div>Caricamento AR in corso…<br />Attendi qualche secondo.</div>
    </div>

    <div class="tap-to-start" id="tapToStart">
      <button id="startButton">Tocca per avviare il video</button>
    </div>

    <div class="ui-message" id="message">Inizializzazione…</div>

    <a-scene
      embedded
      vr-mode-ui="enabled: false"
      renderer="logarithmicDepthBuffer: true"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <video
          id="planet-video"
          src="./planet.mp4"
          preload="auto"
          loop
          muted
          autoplay
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-nft
        id="planet-target"
        type="nft"
        url="./planet"
        emitevents="true"
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <a-video
          src="#planet-video"
          width="1.6"
          height="0.9"
          position="0 0 0"
          rotation="-90 0 0"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>

    <script>
      window.addEventListener("load", function () {
        const video = document.getElementById("planet-video");
        const target = document.getElementById("planet-target");
        const message = document.getElementById("message");
        const tapToStart = document.getElementById("tapToStart");
        const startButton = document.getElementById("startButton");

        let nftLoaded = false;
        let targetFound = false;

        function setMessage(text) {
          message.textContent = text;
        }

        async function ensureVideoPlayback() {
          try {
            await video.play();
            tapToStart.classList.add("is-hidden");
            return true;
          } catch (err) {
            tapToStart.classList.remove("is-hidden");
            return false;
          }
        }

        window.addEventListener("arjs-nft-loaded", async function () {
          nftLoaded = true;
          setMessage("Target pronto. Inquadra l’immagine.");
          await ensureVideoPlayback();
        });

        window.addEventListener("camera-error", function () {
          setMessage("Errore camera. Controlla permessi e HTTPS.");
        });

        window.addEventListener("camera-init", function () {
          if (!nftLoaded) {
            setMessage("Camera attiva. Caricamento target…");
          }
        });

        target.addEventListener("markerFound", async function () {
          targetFound = true;
          setMessage("Target rilevato.");
          await ensureVideoPlayback();
        });

        target.addEventListener("markerLost", function () {
          targetFound = false;
          setMessage("Target perso. Rinquadra l’immagine.");
        });

        startButton.addEventListener("click", async function () {
          const ok = await ensureVideoPlayback();
          if (ok) {
            setMessage(
              targetFound
                ? "Target rilevato."
                : nftLoaded
                ? "Video pronto. Inquadra il target."
                : "Caricamento AR in corso…"
            );
          }
        });

        document.addEventListener(
          "visibilitychange",
          async function () {
            if (!document.hidden && (targetFound || nftLoaded)) {
              await ensureVideoPlayback();
            }
          },
          false
        );
      });
    </script>
  </body>
</html>
