<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Planet AR</title>

    <script src="https://cdn.jsdelivr.net/npm/aframe@1.6.0/dist/aframe-master.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/master/aframe/build/aframe-ar-nft.js"></script>

    <style>
      html,
      body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      .arjs-loader {
        position: fixed;
        inset: 0;
        z-index: 9999;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.82);
        color: #fff;
        text-align: center;
        padding: 24px;
        box-sizing: border-box;
      }

      .arjs-loader__box {
        max-width: 320px;
        line-height: 1.5;
      }

      .arjs-loader__title {
        font-size: 20px;
        font-weight: 700;
        margin-bottom: 8px;
      }

      .arjs-loader__text {
        font-size: 14px;
        opacity: 0.9;
      }
    </style>

    <script>
      window.addEventListener("load", function () {
        AFRAME.registerComponent("video-handler", {
          init: function () {
            const marker = this.el;
            const video = document.querySelector("#planet-video");
            const loader = document.querySelector(".arjs-loader");

            const tryPlay = () => {
              video
                .play()
                .then(() => {
                  // autoplay avviato correttamente
                })
                .catch(() => {
                  // su alcuni dispositivi il browser può richiedere un gesto utente
                });
            };

            marker.addEventListener("markerFound", function () {
              if (loader) loader.style.display = "none";
              tryPlay();
            });

            marker.addEventListener("markerLost", function () {
              video.pause();
            });

            video.addEventListener("ended", function () {
              video.currentTime = 0;
              tryPlay();
            });
          },
        });
      });
    </script>
  </head>

  <body>
    <div class="arjs-loader">
      <div class="arjs-loader__box">
        <div class="arjs-loader__title">Caricamento AR…</div>
        <div class="arjs-loader__text">
          Consenti l'accesso alla fotocamera e inquadra l'immagine <strong>planet.jpg</strong>.
        </div>
      </div>
    </div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; alpha: true; precision: medium"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false"
    >
      <a-assets>
        <video
          id="planet-video"
          src="./planet.mp4"
          preload="auto"
          response-type="arraybuffer"
          loop
          muted
          autoplay
          playsinline
          webkit-playsinline
          crossorigin="anonymous"
        ></video>
      </a-assets>

      <a-nft
        type="nft"
        url="./planet"
        video-handler
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <a-video
          src="#planet-video"
          position="50 150 0"
          rotation="-90 0 0"
          width="300"
          height="169"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
