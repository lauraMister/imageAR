<!DOCTYPE html>
<html lang="it">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover"
    />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <title>Planet AR</title>

    <script src="https://aframe.io/releases/1.6.0/aframe.min.js"></script>
    <script src="https://raw.githack.com/AR-js-org/AR.js/3.4.7/aframe/build/aframe-ar-nft.js"></script>

    <style>
      html,
      body {
        margin: 0;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: #000;
        font-family: Arial, sans-serif;
      }

      body {
        position: relative;
      }

      .arjs-loader {
        position: absolute;
        inset: 0;
        z-index: 20;
        display: flex;
        align-items: center;
        justify-content: center;
        background: rgba(0, 0, 0, 0.72);
        color: #fff;
        text-align: center;
        padding: 24px;
      }

      .status {
        position: absolute;
        left: 50%;
        transform: translateX(-50%);
        z-index: 30;
        width: min(92vw, 420px);
        padding: 10px 14px;
        border-radius: 14px;
        background: rgba(0, 0, 0, 0.58);
        color: #fff;
        text-align: center;
        font-size: 14px;
        line-height: 1.35;
        pointer-events: none;
      }

      #status-top {
        top: calc(env(safe-area-inset-top, 0px) + 12px);
      }

      #status-bottom {
        bottom: calc(env(safe-area-inset-bottom, 0px) + 12px);
      }

      .hidden {
        display: none !important;
      }

      a-scene {
        position: absolute !important;
        inset: 0 !important;
      }
    </style>

    <script>
      window.addEventListener("load", function () {
        const loader = document.getElementById("loader");
        const topStatus = document.getElementById("status-top");
        const bottomStatus = document.getElementById("status-bottom");
        const video = document.getElementById("planet-video");

        function setTop(text) {
          topStatus.textContent = text;
        }

        function setBottom(text) {
          bottomStatus.textContent = text;
        }

        function hideLoader() {
          loader.classList.add("hidden");
        }

        function playVideo() {
          video.muted = true;
          video.loop = true;
          const p = video.play();
          if (p && typeof p.catch === "function") {
            p.catch(function () {});
          }
        }

        function stopVideo() {
          video.pause();
          video.currentTime = 0;
        }

        AFRAME.registerComponent("videohandler", {
          init: function () {
            const marker = this.el;

            marker.addEventListener("markerFound", function () {
              setTop("Immagine riconosciuta");
              setBottom("Video in riproduzione");
              playVideo();
            });

            marker.addEventListener("markerLost", function () {
              setTop("Tracking perso");
              setBottom("Riinquadra l'immagine target");
              stopVideo();
            });
          },
        });

        window.addEventListener("camera-init", function () {
          setTop("Fotocamera attiva");
          setBottom("Se lo schermo resta nero, apri il link in Safari o Chrome");
        });

        window.addEventListener("camera-error", function (e) {
          const detail = e && e.detail ? JSON.stringify(e.detail) : "errore sconosciuto";
          setTop("Errore fotocamera");
          setBottom(detail);
        });

        window.addEventListener("arjs-nft-loaded", function () {
          hideLoader();
          setTop("Target caricato");
          setBottom("Inquadra l'immagine per avviare il video");
        });

        video.addEventListener("loadeddata", function () {
          stopVideo();
        });

        setTimeout(function () {
          hideLoader();
        }, 8000);
      });
    </script>
  </head>

  <body>
    <div id="loader" class="arjs-loader">
      <div>
        Caricamento AR in corso…<br />
        Consenti la fotocamera quando il browser lo chiede.
      </div>
    </div>

    <div id="status-top" class="status">Richiesta accesso fotocamera…</div>
    <div id="status-bottom" class="status">Apri questa pagina direttamente in Safari o Chrome.</div>

    <a-scene
      vr-mode-ui="enabled: false"
      embedded
      renderer="antialias: true; alpha: true; precision: medium;"
      arjs="trackingMethod: best; sourceType: webcam; debugUIEnabled: false;"
    >
      <a-assets>
        <video
          id="planet-video"
          src="./planet.mp4"
          preload="auto"
          response-type="arraybuffer"
          loop
          crossorigin="anonymous"
          webkit-playsinline
          playsinline
          autoplay
          muted
        ></video>
      </a-assets>

      <a-nft
        type="nft"
        url="./planet"
        videohandler
        smooth="true"
        smoothCount="10"
        smoothTolerance="0.01"
        smoothThreshold="5"
      >
        <a-video
          src="#planet-video"
          position="50 150 -100"
          rotation="90 0 180"
          width="300"
          height="175"
        ></a-video>
      </a-nft>

      <a-entity camera></a-entity>
    </a-scene>
  </body>
</html>
